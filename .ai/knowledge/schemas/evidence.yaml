$schema: "https://json-schema.org/draft/2020-12/schema"
title: Evidence
type: object
required: [id, source, locator, observation, discovered_by, confidence]
properties:
  id:
    type: string
    pattern: ^EVD-[0-9]{6}$
  source:
    type: string
    pattern: ^SRC-[0-9]{6}$
  locator:
    type: object
    required: [type]
    properties:
      type:
        type: string
        enum:
          - code_range
          - git_commit
          - document_section
          - log_entry
          - metric_sample
          - trace_span
          - user_statement
          - configuration_value
      path:
        type: string
      line_start:
        type: integer
        minimum: 1
      line_end:
        type: integer
        minimum: 1
      commit_hash:
        type: string
      heading:
        type: string
      timestamp:
        type: string
        format: date-time
      key:
        type: string
  observation:
    type: object
    required: [type, value]
    properties:
      type:
        type: string
        enum:
          - text
          - structured
          - ast_node
          - symbol
          - dependency
          - metric
      value:
        type: object
        additionalProperties: true
      raw_text:
        type: string
        description: Original text snippet for human verification
  extracted:
    type: object
    properties:
      symbols:
        type: array
        items:
          type: string
      dependencies:
        type: array
        items:
          type: string
      metadata:
        type: object
        additionalProperties: true
  discovered_by:
    type: object
    required: [agent, skill, run]
    properties:
      agent:
        type: string
      skill:
        type: string
      run:
        type: string
        pattern: ^RUN-[0-9]{6}$
  confidence:
    type: number
    minimum: 0
    maximum: 1
    description: Confidence in this specific observation